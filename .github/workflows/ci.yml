# CI for NeuralForge-Memory (Rust + MCP + RAG)
# Enforces AGENTS.md rules before PRs: cargo fmt --check && cargo test
# Added to this PR (#8) for GitHub issue #9 (workflow actions) + #7 (cleanup)
# Updated / cited by Grok Build 0.1

name: CI

on:
  push:
    branches: [ main, 'issue-7/*', 'feat/*' ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo fmt --check

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test

  build:
    name: cargo build --release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
